<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join · MessMate</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><header class="top"><a class="brand" href="index.html">Mess<i style="color:#e8a317;font-style:normal">Mate</i></a><nav><a class="btn alt sm" href="login.html">Log in</a><a class="btn sm" href="register.html">Join your mess</a></nav></header>
<main class="auth card" style="padding:1.75rem"><h1 style="font-size:1.9rem">Join your mess</h1><p class="muted">Create a member account. The manager can change roles later.</p>
<div class="err-box" id="err" role="alert"></div>
<div class="field"><label for="name">Full name</label><input id="name" maxlength="60"></div>
<div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username"></div>
<div class="field"><label for="phone">Phone (optional)</label><input id="phone" maxlength="20"></div>
<div class="field"><label for="password">Password (min 6 characters)</label><input id="password" type="password" autocomplete="new-password"></div>
<button class="btn green" id="go" style="width:100%">Create account</button>
<p class="small">Already registered? <a href="login.html">Log in</a></p></main>
<script src="js/app.js"></script><script src="js/auth.js"></script></body></html>
