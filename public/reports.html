<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monthly Report · MessMate</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body><div class="shell"><aside class="side" id="side" aria-label="Sidebar"></aside>
<div><button class="btn alt menu-btn" id="menuBtn" aria-label="Open menu">☰ Menu</button>
<main>
<div class="head"><div><h1>Monthly Report</h1><p class="muted" id="sub"></p></div>
<div class="no-print" style="display:flex;gap:.6rem;align-items:flex-end"><div class="field" style="margin:0"><label for="month">Month</label><input type="month" id="month"></div><a class="btn alt" id="csv" href="#">Download CSV</a><button class="btn" onclick="print()">Print</button></div></div>
<div class="grid" id="stats"></div>
<section class="card"><h2>Hisab per member</h2><p class="muted small">Cost = member meals × meal rate. Balance = deposit − cost (negative means the member owes money).</p>
<div class="tablewrap"><table><thead><tr><th>Member</th><th class="right">Meals</th><th class="right">Cost</th><th class="right">Deposit</th><th class="right">Balance</th></tr></thead><tbody id="rows"></tbody><tfoot id="foot"></tfoot></table></div></section>
<section class="card"><h2>Spending by category</h2><div id="cats"></div></section></main></div></div>
<script src="js/app.js"></script><script src="js/reports.js"></script></body></html>
