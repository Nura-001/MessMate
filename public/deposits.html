<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deposits · MessMate</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body><div class="shell"><aside class="side" id="side" aria-label="Sidebar"></aside>
<div><button class="btn alt menu-btn" id="menuBtn" aria-label="Open menu">☰ Menu</button>
<main>
<div class="head"><div><h1>Deposits</h1><p class="muted">Money members have paid into the mess fund.</p></div><div class="field" style="margin:0"><label for="month">Month</label><input type="month" id="month"></div></div>
<section class="card" id="formCard" hidden><h2>Record a deposit</h2>
<div class="row"><div><label for="who">Member</label><select id="who"></select></div>
<div><label for="amount">Amount (৳)</label><input type="number" id="amount" min="1"></div>
<div><label for="date">Date</label><input type="date" id="date"></div>
<div><label for="note">Note</label><input id="note" maxlength="120"></div>
<div><button class="btn green" id="add">Save deposit</button></div></div></section>
<section class="card"><div class="tablewrap"><table><thead><tr><th>Date</th><th>Member</th><th>Note</th><th class="right">Amount</th><th></th></tr></thead><tbody id="rows"></tbody>
<tfoot><tr><td colspan="3">Total</td><td class="right" id="total"></td><td></td></tr></tfoot></table></div></section></main></div></div>
<script src="js/app.js"></script><script src="js/deposits.js"></script></body></html>
