<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bazar Expenses · MessMate</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body><div class="shell"><aside class="side" id="side" aria-label="Sidebar"></aside>
<div><button class="btn alt menu-btn" id="menuBtn" aria-label="Open menu">☰ Menu</button>
<main>
<div class="head"><div><h1>Bazar Expenses</h1><p class="muted">Member entries wait for manager approval. Only approved items change the meal rate.</p></div><div class="field" style="margin:0"><label for="month">Month</label><input type="month" id="month"></div></div>
<section class="card"><h2>Add expense</h2>
<div class="row">
  <div><label for="title">What was bought</label><input id="title" maxlength="80" placeholder="e.g. Rui fish 3kg"></div>
  <div><label for="cat">Category</label><select id="cat"></select></div>
  <div><label for="amount">Amount (৳)</label><input type="number" id="amount" min="1" step="0.5"></div>
  <div><label for="date">Date</label><input type="date" id="date"></div>
  <div><label for="note">Note (optional)</label><input id="note" maxlength="200"></div>
  <div><button class="btn green" id="add">Add</button></div></div></section>
<section class="card"><div class="row" style="margin-bottom:1rem">
  <div><label for="q">Search</label><input id="q" placeholder="Search items…"></div>
  <div><label for="fcat">Category</label><select id="fcat"><option value="">All</option></select></div>
  <div><label for="fstat">Status</label><select id="fstat"><option value="">All</option><option>approved</option><option>pending</option><option>rejected</option></select></div></div>
<div class="tablewrap"><table><thead><tr><th>Date</th><th>Item</th><th>Category</th><th>Added by</th><th class="right">Amount</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody>
<tfoot><tr><td colspan="4">Approved total</td><td class="right" id="total"></td><td colspan="2"></td></tr></tfoot></table></div></section></main></div></div>
<script src="js/app.js"></script><script src="js/expenses.js"></script></body></html>
