<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manager Panel · MessMate</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body><div class="shell"><aside class="side" id="side" aria-label="Sidebar"></aside>
<div><button class="btn alt menu-btn" id="menuBtn" aria-label="Open menu">☰ Menu</button>
<main>
<div class="head"><div><h1>Manager Panel</h1><p class="muted">Manage members, roles and mess settings.</p></div></div>
<section class="card"><h2>Mess settings</h2><div class="row">
<div><label for="mess">Mess name</label><input id="mess" maxlength="60"></div>
<div><label for="bw">Breakfast counts as (0–1 meal)</label><input type="number" id="bw" min="0" max="1" step="0.25"></div>
<div><button class="btn green" id="saveS">Save settings</button></div></div></section>
<section class="card"><h2>Members</h2><div class="tablewrap"><table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section></main></div></div>
<script src="js/app.js"></script><script src="js/admin.js"></script></body></html>
